name: Deploy jcrt-files to R2 + Worker

# Fast path: one rclone checksum sync replaces the old per-file `wrangler r2 object put`
# loop (~2s of Node CLI startup per file — a full sync took ~30 minutes; rclone does the
# same comparison content-addressed in seconds). Because every run compares the whole
# tree against the bucket by hash, there are no git-diff windows: a file committed while
# its folder was excluded, or during a cancelled run, is simply picked up on the next
# run. Typical push-to-live target: under 30 seconds.

on:
  workflow_dispatch:
    inputs:
      prune_deletes:
        description: "Also delete remote objects that are no longer tracked in git (rclone sync instead of copy)"
        required: false
        default: "false"
      deploy_worker:
        description: "Force a Worker deploy even when src/wrangler.toml did not change."
        required: false
        default: "false"
  push:
    branches: [main, master]
    # Deliberately an ignore-list, not an allow-list: this is a CDN, so any new folder
    # or file must deploy without someone remembering to add a path here first.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'package-lock.json'

concurrency:
  group: deploy-jcrt-files-${{ github.ref }}
  # Safe to cancel a superseded run: sync is content-addressed against the full tree,
  # so the newest run always covers anything an interrupted run left behind.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed by the "Commit refreshed sitemaps" step below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: generate-file-sitemaps.mjs derives lastmod from git commit dates.
          fetch-depth: 0

      # Node 24 pinned explicitly (owner requirement) rather than trusting the
      # runner's preinstalled default, which tracks the image, not this repo.
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Sitemaps are derived from the tracked file list, so they must be rebuilt whenever
      # content changes — otherwise a newly added file is served but never advertised.
      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this cannot loop.
      - name: Regenerate file sitemaps and changelog
        run: |
          node scripts/generate-file-sitemaps.mjs
          node scripts/update-changelog.mjs

      - name: Commit refreshed sitemaps and changelog
        run: |
          set -euo pipefail
          # Gate on sitemaps ALONE. A changelog-only commit would be content-free
          # and would itself need logging next run, so every deploy would burn a
          # commit forever. The changelog only ever rides along with real changes.
          if [[ -z "$(git status --porcelain sitemaps)" ]]; then
            echo "Sitemaps already current; not creating a changelog-only commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemaps CHANGELOG.md
          git commit -m "chore: regenerate file sitemaps and changelog"
          git push

      # rclone is ~20MB of download+unzip on every run; the binary is static and
      # version-agnostic for our use. The install step below is the cache miss path.
      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/rclone
          key: rclone-linux-amd64-2026-08

      - name: Install rclone
        run: |
          set -euo pipefail
          if command -v rclone >/dev/null && rclone version >/dev/null 2>&1; then rclone version | head -1; exit 0; fi
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          sudo unzip -q -j -o /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          rclone version | head -1

      - name: Sync assets to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.JCRT_R2_ACCOUNT_ACCESS_KEY }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.JCRT_R2_ACCOUNT_ACCESS_KEY_SECRET }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_JURISDICTION: ${{ secrets.CLOUDFLARE_R2_JURISDICTION }}
          R2_BUCKET: jcrt-files
          PRUNE_DELETES: ${{ github.event.inputs.prune_deletes }}
        run: |
          set -euo pipefail

          # Jurisdiction-scoped buckets use <account>.<jurisdiction>.r2.cloudflarestorage.com,
          # default buckets the plain hostname. The jurisdiction secret's value has proven
          # unreliable as a router (a non-empty value sent us to an endpoint where the
          # bucket does not exist), so probe: try the plain endpoint first — the wrangler
          # path always reached the bucket without a jurisdiction — then the scoped one.
          CANDIDATES=("https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com")
          if [[ -n "${R2_JURISDICTION:-}" && "${R2_JURISDICTION}" != "default" ]]; then
            CANDIDATES+=("https://${CLOUDFLARE_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com")
          fi
          FOUND=""
          for ep in "${CANDIDATES[@]}"; do
            if RCLONE_CONFIG_R2_ENDPOINT="$ep" rclone lsf "r2:${R2_BUCKET}" --max-depth 1 --fast-list >/dev/null 2>&1; then
              FOUND="$ep"
              break
            fi
            echo "Bucket not reachable via ${ep%%.r2*}...r2.cloudflarestorage.com endpoint variant; trying next."
          done
          if [[ -z "$FOUND" ]]; then
            echo "ERROR: bucket ${R2_BUCKET} not reachable via any candidate endpoint." >&2
            exit 1
          fi
          export RCLONE_CONFIG_R2_ENDPOINT="$FOUND"
          echo "Using R2 endpoint variant: $([[ "$FOUND" == *".${R2_JURISDICTION:-none}."* ]] && echo jurisdiction || echo default)"

          # Every tracked top-level directory except tooling/worker source. Auto-discovered
          # so a newly added content folder is served without editing this file.
          NON_ASSET_DIRS="scripts src"
          mapfile -t TARGETS < <(
            git ls-files | awk -F/ 'NF>1 {print $1}' | sort -u | while read -r d; do
              case "$d" in .*) continue ;; esac
              case " $NON_ASSET_DIRS " in *" $d "*) continue ;; esac
              printf '%s\n' "$d"
            done
          )
          echo "Asset dirs: ${TARGETS[*]}"

          # Sync exactly the git-tracked files: the tree is the source of truth,
          # and untracked local junk can never leak into the bucket.
          git ls-files -- "${TARGETS[@]}" > /tmp/asset-files.txt
          echo "$(wc -l < /tmp/asset-files.txt) tracked asset files"

          # --checksum: R2 etags are md5 for single-part uploads, so comparison is
          # content-addressed and immune to CI checkouts rewriting every mtime.
          RCLONE_FLAGS=(--checksum --transfers 32 --checkers 64 --fast-list --stats-one-line --stats 15s -v)

          if [[ "${PRUNE_DELETES:-false}" == "true" ]]; then
            # True prune: sync each asset dir WITHOUT --files-from. A files-from filter
            # scopes deletion to the listed files, so bucket orphans (absent from git,
            # therefore absent from the list) would never be deleted — the first prune
            # run "succeeded" with zero deletions for exactly that reason. Syncing the
            # directory itself deletes remote objects under that prefix that are not in
            # the checkout, and a fresh CI checkout contains exactly the tracked files.
            for d in "${TARGETS[@]}"; do
              rclone sync "$d" "r2:${R2_BUCKET}/$d" "${RCLONE_FLAGS[@]}"
            done
          else
            # Normal deploys: additive checksum copy of the tracked file list. Never deletes.
            rclone copy . "r2:${R2_BUCKET}" --files-from-raw /tmp/asset-files.txt "${RCLONE_FLAGS[@]}"
          fi

      - name: Decide whether to deploy the Worker
        id: worker
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_DEPLOY_WORKER: ${{ github.event.inputs.deploy_worker }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          DEPLOY=false
          if [[ "${FORCE_DEPLOY_WORKER:-false}" == "true" ]]; then
            DEPLOY=true
          elif [[ "${EVENT_NAME}" == "push" && "${BEFORE_SHA}" != "$ZERO" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if [[ -n "$(git diff --name-only "${BEFORE_SHA}" HEAD -- src wrangler.toml)" ]]; then
              DEPLOY=true
            fi
          fi
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "Worker deploy: ${DEPLOY}"

      # Wrangler is only installed on the runs that actually deploy the Worker —
      # it cost ~11s (setup-node + npm i -g) on every asset-only push.
      - name: Deploy Worker
        if: steps.worker.outputs.deploy == 'true'
        env:
          # Multiple candidates: the primary secret is malformed (Cloudflare 6111,
          # "Invalid format for Authorization header" — usually a stray newline), which
          # the old workflow masked with a silent 5-token fallback chain. Tokens are
          # whitespace-trimmed and tried in order; the first that verifies deploys.
          TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_V2: ${{ secrets.CLOUDFLARE_API_TOKEN_V2 }}
          TOKEN_BACKUP: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The deploy itself is the test. A whoami gate proved too weak: an account
          # token can pass whoami yet lack Workers deploy permission, which stopped the
          # chain at the first well-formed-but-underprivileged token.
          for name in TOKEN_PRIMARY TOKEN_V2 TOKEN_BACKUP; do
            token="$(printf '%s' "${!name:-}" | tr -d '[:space:]')"
            [[ -z "$token" ]] && continue
            echo "Attempting worker deploy with ${name}"
            if CLOUDFLARE_API_TOKEN="$token" npx --yes wrangler@4 deploy; then
              echo "Deployed with ${name}"
              exit 0
            fi
            echo "${name} could not deploy; trying next."
          done
          echo "ERROR: no Cloudflare token could deploy the worker." >&2
          exit 1
