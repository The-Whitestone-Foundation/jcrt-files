name: Generate Citations and Metadata

on:
  workflow_dispatch:
  # jcrt-v2 dispatches this exact event type ("generate-citations") to trigger
  # this workflow — keep the type unchanged even though the workflow now also
  # generates metadata, or the pipeline silently disconnects.
  repository_dispatch:
    types: [generate-citations]

concurrency:
  group: generate-citations
  cancel-in-progress: true

# The job commits the regenerated citation files back to this repo. The org
# default for GITHUB_TOKEN is read-only, so the push needs this explicitly.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jcrt-files
        uses: actions/checkout@v6

      - name: Checkout jcrt-v2 content
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/jcrt-v2
          path: jcrt-v2
          sparse-checkout: |
            content/archives
            content/religioustheory/posts
            content/religioustheory/live
            _data/legacy-ris-dates.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Generate citation files
        run: node scripts/generate-citations.mjs ./jcrt-v2

      # Force mode is intentionally not passed: the default missing-only
      # behaviour is what protects the 1,166 hand-curated metadata files
      # from being overwritten by CI.
      - name: Generate metadata files
        run: node scripts/generate-metadata.mjs ./jcrt-v2

      - name: Check for changes
        id: changes
        run: |
          git add citations/ metadata/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$(git diff --cached --stat)"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate citation and metadata files"
          git push
