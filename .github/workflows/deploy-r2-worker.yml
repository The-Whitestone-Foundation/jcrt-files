name: Deploy jcrt-files to R2 + Worker

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all tracked asset files (images/archives/citations/docs/metadata/religioustheory/sitemaps)"
        required: false
        default: "false"
      prune_deletes:
        description: "Delete removed files from remote R2 (slower)"
        required: false
        default: "false"
      target_dirs:
        description: "Comma-separated dirs to sync (e.g. 'metadata,docs'). Empty = all targets."
        required: false
        default: ""
      deploy_worker:
        description: "Force a Worker deploy even when only asset files changed."
        required: false
        default: "false"
  push:
    branches: [main, master]
    # Deliberately an ignore-list, not an allow-list: this is a CDN, so any new folder
    # or file must deploy without someone remembering to add a path here first.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'package-lock.json'

concurrency:
  group: deploy-jcrt-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Needed by the "Commit refreshed sitemaps" step below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sitemaps are derived from the tracked file list, so they must be rebuilt whenever
      # content changes — otherwise a newly added file is served but never advertised.
      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this cannot loop.
      - name: Regenerate file sitemaps
        run: node scripts/generate-file-sitemaps.mjs

      - name: Commit refreshed sitemaps
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain sitemaps)" ]]; then
            echo "Sitemaps already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemaps
          git commit -m "chore: regenerate file sitemaps"
          git push

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Upload changed/new files to R2 and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_V2: ${{ secrets.CLOUDFLARE_API_TOKEN_V2 }}
          CLOUDFLARE_API_TOKEN_BACKUP: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
          CLOUDFLARE_API_TOKEN_R2_ACCOUNT: ${{ secrets.JCRT_R2_Account_Token }}
          CLOUDFLARE_API_TOKEN_R2_ACCOUNT_ALT: ${{ secrets.JCRT_R2_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: jcrt-files
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.full_sync }}
          PRUNE_DELETES: ${{ github.event.inputs.prune_deletes }}
          TARGET_DIRS: ${{ github.event.inputs.target_dirs }}
          FORCE_DEPLOY_WORKER: ${{ github.event.inputs.deploy_worker }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Every tracked top-level directory except tooling/worker source. Auto-discovered
          # so a newly added content folder is served without editing this file.
          NON_ASSET_DIRS="scripts src"
          mapfile -t DEFAULT_TARGETS < <(
            git ls-files | awk -F/ 'NF>1 {print $1}' | sort -u | while read -r d; do
              # Skip dot-directories (.github, .vscode, …) — never CDN content.
              case "$d" in .*) continue ;; esac
              case " $NON_ASSET_DIRS " in *" $d "*) continue ;; esac
              printf '%s\n' "$d"
            done
          )
          echo "Discovered asset dirs: ${DEFAULT_TARGETS[*]}"
          UPLOAD_PARALLELISM=6
          if [[ -n "${TARGET_DIRS:-}" ]]; then
            IFS=',' read -ra TARGETS <<< "$TARGET_DIRS"
            echo "Using custom targets: ${TARGETS[*]}"
          else
            TARGETS=("${DEFAULT_TARGETS[@]}")
          fi
          ZERO="0000000000000000000000000000000000000000"
          AFTER_REF="${AFTER_SHA:-$(git rev-parse HEAD)}"
          BASE_REF=""

          pick_working_token() {
            local token_label="$1"
            local token_value="$2"
            if [[ -z "${token_value}" ]]; then
              return 1
            fi
            export CLOUDFLARE_API_TOKEN="${token_value}"
            if wrangler r2 bucket list >/tmp/r2-buckets.txt 2>/tmp/r2-preflight.err; then
              echo "Cloudflare auth preflight passed using ${token_label}."
              return 0
            fi
            return 1
          }

          echo "Preflight: listing remote R2 buckets..."
          if ! pick_working_token "CLOUDFLARE_API_TOKEN" "${CLOUDFLARE_API_TOKEN_PRIMARY:-}"; then
            echo "Primary Cloudflare token failed; trying CLOUDFLARE_API_TOKEN_V2."
            if ! pick_working_token "CLOUDFLARE_API_TOKEN_V2" "${CLOUDFLARE_API_TOKEN_V2:-}"; then
              echo "V2 token failed; trying backup token."
              if ! pick_working_token "CLOUDFLARE_API_TOKEN_BACKUP" "${CLOUDFLARE_API_TOKEN_BACKUP:-}"; then
                echo "Backup token failed; trying R2 account token."
                if ! pick_working_token "JCRT_R2_Account_Token" "${CLOUDFLARE_API_TOKEN_R2_ACCOUNT:-}"; then
                  echo "R2 account token failed; trying alternate R2 token name."
                  if ! pick_working_token "JCRT_R2_ACCOUNT_TOKEN" "${CLOUDFLARE_API_TOKEN_R2_ACCOUNT_ALT:-}"; then
                    echo "No working Cloudflare API token found."
                    if [[ -s /tmp/r2-preflight.err ]]; then
                      sed -n '1,120p' /tmp/r2-preflight.err
                    fi
                    exit 1
                  fi
                fi
              fi
            fi
          fi

          if ! grep -q "^name:.*${R2_BUCKET}$" /tmp/r2-buckets.txt; then
            echo "Configured R2 bucket not found in account: ${R2_BUCKET}"
            echo "Available buckets:"
            cat /tmp/r2-buckets.txt
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE_FULL_SYNC}" == "true" ]]; then
            echo "Manual full sync requested; uploading all tracked target files."
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git rev-parse "${AFTER_REF}^" >/dev/null 2>&1; then
              BASE_REF="$(git rev-parse "${AFTER_REF}^")"
              echo "Manual incremental sync from ${BASE_REF} to ${AFTER_REF}."
            else
              echo "No parent commit available for manual incremental sync; falling back to full sync."
            fi
          elif [[ "${BEFORE_SHA}" == "$ZERO" ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable before SHA for push event; falling back to full sync."
          else
            BASE_REF="${BEFORE_SHA}"
            echo "Push incremental sync from ${BASE_REF} to ${AFTER_REF}."
          fi

          if [[ -n "${BASE_REF}" ]]; then
            # Sitemaps are always re-uploaded: they are regenerated above, after AFTER_REF
            # was resolved, so a diff against it would miss them.
            mapfile -t CHANGED < <(
              { git diff --name-only --diff-filter=ACMRT "${BASE_REF}" "${AFTER_REF}" -- "${TARGETS[@]}" || true
                git ls-files sitemaps || true; } | sort -u
            )
            mapfile -t DELETED < <(git diff --name-only --diff-filter=D "${BASE_REF}" "${AFTER_REF}" -- "${TARGETS[@]}" || true)
          else
            mapfile -t CHANGED < <(git ls-files "${TARGETS[@]}" || true)
            mapfile -t DELETED < <(printf "")
          fi

          SHOULD_DEPLOY_WORKER="false"
          if [[ "${FORCE_DEPLOY_WORKER:-false}" == "true" ]]; then
            SHOULD_DEPLOY_WORKER="true"
            echo "Worker deploy forced by workflow_dispatch input."
          elif [[ -n "${BASE_REF}" ]]; then
            mapfile -t WORKER_CHANGED < <(git diff --name-only "${BASE_REF}" "${AFTER_REF}" -- src wrangler.toml || true)
            if [[ ${#WORKER_CHANGED[@]} -gt 0 ]]; then
              SHOULD_DEPLOY_WORKER="true"
            fi
          elif [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            SHOULD_DEPLOY_WORKER="true"
            echo "No reliable diff base for push event; conservatively deploying Worker."
          fi

          echo "Changed/new files: ${#CHANGED[@]}"
          echo "Deleted files: ${#DELETED[@]}"
          echo "Deploy Worker: ${SHOULD_DEPLOY_WORKER}"

          if [[ ${#CHANGED[@]} -gt 0 ]]; then
            FILES_TO_UPLOAD=()
            for file in "${CHANGED[@]}"; do
              [[ -f "$file" ]] || continue
              FILES_TO_UPLOAD+=("$file")
            done

            TOTAL=${#FILES_TO_UPLOAD[@]}
            SUCCESS=0
            FAIL=0
            cat >/tmp/upload-r2-object.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          file="$1"
          for attempt in 1 2 3 4 5; do
            if wrangler r2 object put "$R2_BUCKET/$file" --file "$file" --remote >/dev/null 2>&1; then
              printf 'OK|%s\n' "$file"
              exit 0
            fi
            printf 'Retry %s/5: %s\n' "$attempt" "$file" >&2
            sleep $((attempt * 2))
          done
          printf 'FAIL|%s\n' "$file"
          EOF
            chmod +x /tmp/upload-r2-object.sh

            if [[ ${TOTAL} -gt 0 ]]; then
              mapfile -t UPLOAD_RESULTS < <(printf '%s\0' "${FILES_TO_UPLOAD[@]}" | xargs -0 -r -n 1 -P "${UPLOAD_PARALLELISM}" /tmp/upload-r2-object.sh)
              for result in "${UPLOAD_RESULTS[@]}"; do
                case "$result" in
                  OK\|*)
                    SUCCESS=$((SUCCESS + 1))
                    echo "[$SUCCESS/$TOTAL] OK: ${result#OK|}"
                    ;;
                  FAIL\|*)
                    FAIL=$((FAIL + 1))
                    echo "FAILED ($FAIL): ${result#FAIL|}"
                    ;;
                esac
              done
            fi
            echo "Upload summary: $SUCCESS succeeded, $FAIL failed out of $TOTAL"
            if [[ "$FAIL" -gt 0 ]]; then
              echo "WARNING: $FAIL uploads failed, but continuing with deploy"
            fi
          fi

          if [[ "${PRUNE_DELETES:-false}" == "true" ]]; then
            for file in "${DELETED[@]}"; do
              [[ -n "$file" ]] || continue
              echo "DELETE $file"
              wrangler r2 object delete "$R2_BUCKET/$file" --remote || true
            done
          else
            echo "Skipping delete prune (PRUNE_DELETES=${PRUNE_DELETES:-false})."
          fi

          if [[ "${SHOULD_DEPLOY_WORKER}" == "true" ]]; then
            echo "Deploying Worker using verified token..."
            wrangler deploy
          else
            echo "Skipping Worker deploy; no Worker changes detected."
          fi
